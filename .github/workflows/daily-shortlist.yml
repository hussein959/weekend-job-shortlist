name: Weekend job shortlist

on:
  schedule:
    # Saturday and Sunday, 04:00 UTC = 07:00 Baghdad time.
    # GitHub may start scheduled runs a few minutes late.
    - cron: "0 4 * * 6,0"
  workflow_dispatch: {}   # "Run workflow" button for manual/test runs

# Public repo: secrets are only available to runs started by the schedule or by
# someone with write access (never to pull requests from forks).
permissions:
  contents: read

concurrency:
  group: daily-shortlist
  cancel-in-progress: false

jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Remembers which jobs were already screened, across days.
      - name: Restore seen-jobs state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: seen-jobs-${{ github.run_id }}
          restore-keys: seen-jobs-

      - name: Build and email shortlist
        run: python -m src.main
        env:
          # Repository *variable* (not a secret): outside_iraq (default) or iraq_only.
          JOB_REGION: ${{ vars.JOB_REGION }}
          CV_URL: ${{ secrets.CV_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_SCREEN_MODEL: ${{ secrets.LLM_SCREEN_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}

      - name: Save seen-jobs state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: seen-jobs-${{ github.run_id }}

      # No artifact upload: this repo is public, so run artifacts would be downloadable
      # by anyone. Tailored CVs are only delivered by email.
